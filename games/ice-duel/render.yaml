# Render Blueprint：線上對戰伺服器（Node + WebSocket）。區域固定為新加坡。
services:
  - type: web
    name: ice-duel-server
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: npx tsx server/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
