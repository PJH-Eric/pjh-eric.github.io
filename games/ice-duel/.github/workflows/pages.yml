name: 部署到 GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # 在 GitHub 倉庫 Settings → Secrets and variables → Actions → Variables 設定 GAME_SERVER_URL
          VITE_GAME_SERVER_URL: ${{ vars.GAME_SERVER_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: 注入 GA4 與 SEO
        run: node scripts/inject-seo.mjs
        env:
          # 可在 repo Variables 設定 GA_MEASUREMENT_ID 覆寫；未設定時使用共用資源 G-PG79WZK8QY
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
