# 把 public/ 發到 GitHub Pages，後端跑在 Render。
#
# 整套流程只需要設定一個參數：
#   Settings → Secrets and variables → Actions → Variables → GAME_SERVER_URL
#   例如 https://fruit-link.onrender.com （Render 服務的網址，不要加結尾斜線）
#
# 這個值不進版控，佈署時才注入 public/js/config.js 的 INJECTED 那一行。
# 沒設定就直接讓 workflow 失敗 —— 因為靜默發佈出去的頁面會退回同源（github.io），
# 線上功能看起來是開著的、實際上每次連線都會失敗，比直接紅燈更難查。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_url:
        description: "臨時覆蓋 GAME_SERVER_URL（留空就用 repository variable）"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.1"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: 注入 server URL（唯一要設定的參數）
        env:
          GAME_SERVER_URL: ${{ github.event.inputs.server_url || vars.GAME_SERVER_URL }}
        run: |
          if [ -z "$GAME_SERVER_URL" ]; then
            echo "::error title=缺少 GAME_SERVER_URL::請到 Settings → Secrets and variables → Actions → Variables 新增 GAME_SERVER_URL，填 Render 服務網址（例如 https://fruit-link.onrender.com）。"
            exit 1
          fi
          node scripts/inject-server-url.js
          echo "### 後端 server URL" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$GAME_SERVER_URL\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 驗證並注入 GA4 與 SEO
        run: node tests/seo.js && node scripts/inject-seo.js

      - name: Upload public/ as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: "github-pages-${{ github.run_attempt }}"
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: "github-pages-${{ github.run_attempt }}"
