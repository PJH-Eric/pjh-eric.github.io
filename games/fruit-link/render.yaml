# Render 藍圖：在 Render 選 "New > Blueprint"、指到這個 repo 就能一鍵部署。
#
# 免費方案的限制（設計時已經考慮進去）：
#   - 支援 WebSocket（Socket.IO），但閒置約 15 分鐘會休眠，
#     第一次連線要等十幾秒喚醒 —— 前端的 /health 檢查逾時放寬到 10 秒就是為了這個。
#   - 檔案系統是暫時的，服務重啟就清空 —— 所以房間只存在記憶體，
#     不寫任何檔案，重啟後房間消失是預期行為。
#   - 有 CPU / 頻寬配額 —— 搶消是事件驅動（不是每幀送完整盤面），
#     主迴圈只負責「時間到就結算」，空房與打完很久的房間會自動回收。
services:
  - type: web
    name: fruit-link
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "26.12.1"
      # 允許連線的前端來源，逗號分隔。
      # 預設 * 讓 Blueprint 一鍵就能跑（前端在 Render 或 GitHub Pages 都通），
      # 整套佈署因此只剩 GitHub 那邊的 GAME_SERVER_URL 要填。
      # 想收緊就改成前端網址，例如 https://你的帳號.github.io
      - key: GAME_ALLOWED_ORIGIN
        value: "*"
      # 開賽倒數（毫秒）
      - key: COUNTDOWN_MS
        value: "3000"
